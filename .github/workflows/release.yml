name: Publish versioned source release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package and publish the source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          archive="DevFlow-AI-$tag.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its assets unchanged."
            exit 0
          fi
          git archive --format=zip --prefix="DevFlow-AI-$tag/" --output="../$archive" "$GITHUB_SHA"
          (cd .. && sha256sum "$archive" > "$archive.sha256")
          gh release create "$tag" "../$archive" "../$archive.sha256" \
            --target "$GITHUB_SHA" \
            --title "DevFlow AI $tag" \
            --notes-file RELEASE_NOTES.md \
            --latest
