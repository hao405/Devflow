name: Publish versioned source release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - RELEASE_NOTES.md
      - 'dev项目/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package and publish the source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          archive="DevFlow-AI-$tag.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ ! -d 'dev项目' ]]; then
              echo "Release $tag already exists; no project notes to attach."
              exit 0
            fi
            code_changes="$(git diff --name-only "$tag" "$GITHUB_SHA" -- . \
              ':!dev项目' ':!README.md' ':!RELEASE_NOTES.md' \
              ':!MANIFEST.sha256' ':!.gitignore' ':!.github/workflows/release.yml')"
            if [[ -n "$code_changes" ]]; then
              echo "Existing release supplements must contain documentation changes only."
              echo "$code_changes"
              exit 1
            fi
            supplement="DevFlow-AI-$tag-with-docs.zip"
            git archive --format=zip --prefix="DevFlow-AI-$tag/" --output="../$supplement" "$GITHUB_SHA"
            (cd .. && sha256sum "$supplement" > "$supplement.sha256")
            gh release upload "$tag" "../$supplement" "../$supplement.sha256" --clobber
            notes_file="$(mktemp)"
            cp RELEASE_NOTES.md "$notes_file"
            printf '\n文档补充构建：[%s](https://github.com/%s/commit/%s)。\n' \
              "$GITHUB_SHA" "$GH_REPO" "$GITHUB_SHA" >> "$notes_file"
            gh release edit "$tag" --notes-file "$notes_file"
            rm -f "$notes_file"
            exit 0
          fi
          git archive --format=zip --prefix="DevFlow-AI-$tag/" --output="../$archive" "$GITHUB_SHA"
          (cd .. && sha256sum "$archive" > "$archive.sha256")
          gh release create "$tag" "../$archive" "../$archive.sha256" \
            --target "$GITHUB_SHA" \
            --title "DevFlow AI $tag" \
            --notes-file RELEASE_NOTES.md \
            --latest
